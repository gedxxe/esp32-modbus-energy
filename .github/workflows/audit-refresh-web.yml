name: Temporary audit web bundle refresh

on:
  push:
    branches:
      - audit/wifi-enterprise-recovery-c3-20261105
    paths:
      - .github/workflows/audit-refresh-web.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Rebuild embedded dashboard and manifest
        run: npm run build:web
      - name: Commit regenerated source-derived outputs
        run: |
          git add firmware/include/web_ui.h web/bundle.json
          if git diff --cached --quiet; then
            echo "Assets already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(web): refresh audited dashboard bundle'
          git push origin HEAD:refs/heads/audit/wifi-enterprise-recovery-c3-20261105
