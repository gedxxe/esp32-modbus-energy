name: Temporary audited web rebuild

on:
  push:
    branches: [audit/wifi-enterprise-recovery-c3-20261105]
    paths: [.github/workflows/audit-refresh-web.yml]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: |
          git add firmware/include/web_ui.h web/bundle.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(web): update C3 gateway text in embedded UI'
          git push origin HEAD:refs/heads/audit/wifi-enterprise-recovery-c3-20261105
