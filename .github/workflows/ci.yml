name: Firmware and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Native regression tests
        run: |
          mkdir -p tmp
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include firmware/test/test_energy.cpp -o tmp/fort-test
          ./tmp/fort-test
      - name: Check generated assets and documentation
        run: |
          python tools/generate_docs.py
          python tools/check_docs.py
          git diff --exit-code -- docs/assets docs/wiring-netlist.csv

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Build ESP32-S3 N16R8
        working-directory: firmware
        run: pio run
      - uses: actions/upload-artifact@v7
        with:
          name: esp32s3-build
          include-hidden-files: true
          if-no-files-found: error
          path: |
            firmware/.pio/build/esp32s3/firmware.bin
            firmware/.pio/build/esp32s3/firmware.elf
            firmware/.pio/build/esp32s3/bootloader.bin
            firmware/.pio/build/esp32s3/partitions.bin

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-and-svg-previews
          path: output/previews/
