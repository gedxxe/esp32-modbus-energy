name: Firmware and documentation

on:
  push:
  pull_request:
  workflow_dispatch:

# A branch has both push and PR events. Do not run duplicate SDK tool
# downloads against GitHub Releases at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic-and-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install PDF text extractor
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Source audit
        run: |
          python tools/security_audit.py --self-test
          python tools/security_audit.py --current --history
          python tools/check_iot_provision.py --self-test
      - name: Native regression tests
        run: |
          g++ --version
          mkdir -p tmp
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include firmware/test/test_energy.cpp firmware/src/oled_frames.cpp -o tmp/fort-test
          ./tmp/fort-test
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/test/arduino_stub -Ifirmware/lib/FortMeter/src firmware/test/test_debug_sketch.cpp firmware/lib/FortMeter/src/ModbusMaster.cpp -o tmp/fort-debug-test
          ./tmp/fort-debug-test
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/test/arduino_stub -Ifirmware/include -Ifirmware/lib/FortMeter/src firmware/test/test_diagnostics.cpp firmware/lib/FortMeter/src/ModbusMaster.cpp -o tmp/fort-main-debug-test
          ./tmp/fort-main-debug-test
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include firmware/test/test_power_lora.cpp -o tmp/power-lora-test
          ./tmp/power-lora-test
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/include firmware/test/test_iot_contract.cpp -o tmp/iot-contract-test
          ./tmp/iot-contract-test
          g++ -std=c++11 -Wall -Wextra -Werror -Ifirmware/test/network_stub -Ifirmware/include firmware/test/test_network.cpp firmware/src/enterprise_station.cpp -o tmp/network-test
          ./tmp/network-test
          python tools/check_lora.py
      - name: Check generated assets and documentation
        run: |
          python tools/generate_docs.py
          python tools/check_docs.py
          git diff --exit-code -- docs/assets docs/wiring-netlist.csv

  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the pinned managed Core
        run: |
          python tools/setup-core.py
          echo "$HOME/.platformio/penv/bin" >> "$GITHUB_PATH"
      - name: Build ESP32-S3 N16R8
        working-directory: firmware
        shell: bash
        run: |
          # Retry only external SDK/platform download failures, not C++ errors.
          # The clean runner can receive a transient 504 from GitHub Releases.
          set -o pipefail
          for attempt in 1 2 3; do
            if pio run 2>&1 | tee "$RUNNER_TEMP/firmware-pio-${attempt}.log"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ] || ! grep -Eq 'PackageException:.*(504|503|502|429)|idf_tools.py installation failed|does not appear to be a Python project|is not a full path and was not found in the PATH' "$RUNNER_TEMP/firmware-pio-${attempt}.log"; then
              exit 1
            fi
            echo "External SDK/tool download failed. Retrying installation (attempt $((attempt+1))/3)." >&2
            sleep $((attempt * 10))
          done
      - name: Compile standalone Arduino diagnostic
        run: pio run -d examples/FortSerialDebug
      - uses: actions/upload-artifact@v7
        with:
          name: esp32s3-build
          include-hidden-files: true
          if-no-files-found: error
          path: |
            firmware/.pio/build/esp32s3/firmware.bin
            firmware/.pio/build/esp32s3/firmware.elf
            firmware/.pio/build/esp32s3/bootloader.bin
            firmware/.pio/build/esp32s3/partitions.bin
      - name: Build opt-in HTTPS variant with synthetic credentials (never distributed)
        working-directory: firmware
        shell: bash
        run: |
          # The uploaded release artifact above is the feature-disabled build.
          # This fake header is ephemeral and must never reach a production device.
          trap 'rm -f include/iot_credentials.local.h' EXIT
          python - <<'PY'
          from pathlib import Path
          lines = [
              '#pragma once',
              '#define IOT_DEV_ENABLED 1',
              '#define IOT_DEV_ENDPOINT "https://synthetic.invalid/api/iot-ingest"',
              '#define IOT_DEV_DEVICE_ID "ci_synthetic"',
              '#define IOT_DEV_METER_ID "ci_meter"',
              '#define IOT_DEV_METER_PROFILE "fort"',
              '#define IOT_DEV_BEARER "' + 'A' * 43 + '"',
              '',
          ]
          Path('include/iot_credentials.local.h').write_text('\n'.join(lines))
          PY
          git check-ignore -q include/iot_credentials.local.h
          pio run --target clean
          pio run

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Verify committed React assets
        run: npm run check:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:meter-lab
      - run: npm run test:enterprise
      - run: npm run test:lora
      - run: npm run test:habuer
      - run: npm run test:acrel
      - run: npm run test:adl400
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-and-svg-previews
          path: output/previews/
