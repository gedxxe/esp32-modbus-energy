name: One-off embedded UI rebuild
on:
  push:
    paths:
      - .github/workflows/regenerate-embedded-ui-once.yml
permissions:
  contents: write
jobs:
  rebuild:
    if: github.ref_name == 'audit/rtc-lora-ui-brand-20261105'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/bundle.json firmware/include/web_ui.h
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate embedded UI for RTC, LoRa and branding"
            git push origin HEAD:refs/heads/audit/rtc-lora-ui-brand-20261105
          fi
