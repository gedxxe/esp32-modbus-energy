<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc"><title id="title">Tasks, queues and peripheral ownership</title><desc id="desc">Midea Fort schematic. Labels and colors identify connections. Screen values are simulated.</desc><rect width="100%" height="100%" fill="#f5f8f8"/>
<text x="45" y="60" fill="#183438" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Task ownership and data flow</text>
<text x="45" y="96" fill="#587176" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Commands and snapshots are copied through queues. I2C and filesystem operations use mutexes.</text>
<rect x="55" y="160" width="510" height="300" rx="16" fill="#ffffff" stroke="#cbdada"/>
<text x="80" y="204" fill="#087e82" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">CORE 0 / UI · PRIORITY 1</text>
<text x="80" y="260" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">HTTP + browser API</text>
<text x="80" y="303" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Buttons / 35 ms debounce</text>
<text x="80" y="346" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">OLED ≥300 ms / RGB RMT ≥20 ms</text>
<text x="80" y="389" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Wi-Fi tasks managed by ESP-IDF</text>
<rect x="835" y="160" width="510" height="300" rx="16" fill="#ffffff" stroke="#cbdada"/>
<text x="860" y="204" fill="#087e82" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">CORE 1 / ACQUISITION · PRIORITY 2</text>
<text x="860" y="260" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">ModbusMaster / direction / scan</text>
<text x="860" y="303" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">RTC + CT/PT + kWh counter</text>
<text x="860" y="346" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">9 scheduled intervals + quality</text>
<text x="860" y="389" fill="#183438" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">NVS checkpoint + CSV / LittleFS</text>
<polyline points="565,250 835,250" fill="none" stroke="#6d5897" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="700" y="228" fill="#6d5897" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Command →</text>
<text x="700" y="277" fill="#587176" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">queue: 6 values</text>
<polyline points="835,380 565,380" fill="none" stroke="#28755e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="700" y="355" fill="#28755e" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">← Snapshot</text>
<text x="700" y="407" fill="#587176" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle">queue: 1 value</text>
<rect x="55" y="500" width="1290" height="100" rx="16" fill="#ffffff" stroke="#cbdada"/>
<text x="85" y="539" fill="#183438" font-family="Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start">2 s acquisition target  ·  2.5 s browser refresh  ·  8 s watchdog</text>
<text x="85" y="575" fill="#587176" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Yield while waiting: idle and system tasks must run. Target periods are not hard real-time deadlines.</text>
</svg>
