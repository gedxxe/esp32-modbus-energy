<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc"><title id="title">Cara memilih kaki tactile switch dan menghubungkannya ke ESP32</title><desc id="desc">Diagram lokal Midea Fort. Warna dan label menandai koneksi; data tampilan adalah simulasi.</desc><rect width="100%" height="100%" fill="#0e1825"/>
