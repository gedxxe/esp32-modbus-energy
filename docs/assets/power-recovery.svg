<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Checkpoint persistence and restart recovery</title><desc id="desc">Software recovery flow. Hardware power-cut validation and supply hold-up measurements are still required.</desc><rect width="100%" height="100%" fill="#f5f8f8"/>
<text x="45" y="60" fill="#183438" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start">Power interruption · retain valid records</text>
<text x="45" y="96" fill="#587176" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">A completed checkpoint is immutable. No last-moment flash write is attempted after power has already failed.</text>
<rect x="45" y="170" width="390" height="225" rx="16" fill="#ffffff" stroke="#cbdada"/>
<text x="65" y="215" fill="#183438" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Core 1 sample</text>
<text x="65" y="263" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">RTC request/response timestamps</text>
<text x="65" y="303" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">FC03 response + CRC acceptance</text>
<text x="65" y="343" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Explicit 446-byte schema-3 record</text>
<rect x="505" y="170" width="390" height="225" rx="16" fill="#ffffff" stroke="#cbdada"/>
<text x="525" y="215" fill="#183438" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Verified persistence</text>
<text x="525" y="263" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">NVS write + byte-for-byte readback</text>
<text x="525" y="303" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">LittleFS staged write + readback</text>
<text x="525" y="343" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Validate before backup promotion</text>
<rect x="965" y="170" width="390" height="225" rx="16" fill="#ffffff" stroke="#cbdada"/>
<text x="985" y="215" fill="#183438" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">Restart recovery</text>
<text x="985" y="263" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Reject truncated or bad-CRC data</text>
<text x="985" y="303" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Compare NVS / final / backup / stage</text>
<text x="985" y="343" fill="#587176" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Select valid day / revision / generation</text>
<polyline points="435,275 505,275" fill="none" stroke="#087e82" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="895,275 965,275" fill="none" stroke="#087e82" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="45" y="460" width="1310" height="165" rx="16" fill="#ffffff" stroke="#cbdada"/>
<text x="75" y="505" fill="#183438" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="start">After restart</text>
<text x="75" y="545" fill="#587176" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Break continuity, keep completed checkpoints, and mark elapsed capture windows as missed.</text>
<text x="75" y="582" fill="#587176" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">If saved meter configuration is invalid or missing beside old data, require verified settings before production resumes.</text>
<text x="45" y="675" fill="#087e82" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Unfinished writes can still be lost. CRC detects corruption and does not repair it. Supply stability remains a hardware requirement.</text>
</svg>
