<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc"><title id="title">Confirmed automatic-direction RS485 installation</title><desc id="desc">Logical nets, not physical header positions. User-confirmed module TXD to ESP32 GPIO18, RXD from GPIO17. GPIO16 unconnected.</desc><rect width="100%" height="100%" fill="#f5f8f8"/>
