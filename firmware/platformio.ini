[platformio]
default_envs = esp32s3

[env:esp32s3]
; Arduino-ESP32 3.3.12 contains upstream WebServer header/read deadline hardening.
; Pioarduino -1 includes a SCons 4.11 compatibility fix; SDK remains ESP-IDF 5.5.5.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=1
  -DARDUINO_RUNNING_CORE=0
  -DARDUINO_EVENT_RUNNING_CORE=0
  -DBOARD_HAS_PSRAM
framework = arduino
custom_sdkconfig =
  CONFIG_MBEDTLS_HAVE_TIME_DATE=y
  CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y
  ; Explicitly select the Mbed TLS Kconfig choice, not just the new value:
  ; the pinned SDK defaults to internal-only and Kconfig can keep it selected.
  CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC=n
  CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y
  ; External Mbed TLS allocation requires a PSRAM heap_caps-compatible mode.
  CONFIG_SPIRAM=y
  CONFIG_SPIRAM_USE_MALLOC=y
  CONFIG_ESP_HTTP_CLIENT_ENABLE_HTTPS=y
  CONFIG_ARDUINO_RUN_CORE1=n
  CONFIG_ARDUINO_RUN_CORE0=y
  CONFIG_ARDUINO_EVENT_RUN_CORE1=n
  CONFIG_ARDUINO_EVENT_RUN_CORE0=y
extra_scripts =
  pre:../tools/pio_paths.py
  pre:../tools/pio_web.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit SSD1306@2.5.13
  adafruit/Adafruit GFX Library@1.11.11
  adafruit/Adafruit BusIO@1.17.0
  adafruit/RTClib@2.1.4
  bblanchon/ArduinoJson@7.3.1
  jgromes/RadioLib@7.8.1
